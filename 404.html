<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ataîru</title>
    <script>
      // Single Page App redirect
      // On GitHub Pages project sites we keep the repo segment (/atairu-site/).
      // On the custom domain (atairu.tur.br) the app is served from root, keep 0.
      var l = window.location;
      var pathSegmentsToKeep = l.hostname.indexOf('github.io') !== -1 ? 1 : 0;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
