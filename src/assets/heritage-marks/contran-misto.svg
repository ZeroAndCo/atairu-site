  <rect x="28" y="28" width="144" height="144" fill="#FFFFFF"/>
  <g fill="#111111">
    <!-- Tree (left) -->
    <rect x="58" y="120" width="9" height="36"/>
    <circle cx="62.5" cy="98" r="20"/>
    <circle cx="48" cy="108" r="14"/>
    <circle cx="77" cy="108" r="14"/>
