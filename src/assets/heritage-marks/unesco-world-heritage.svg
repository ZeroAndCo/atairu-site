<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="UNESCO World Heritage emblem">
  <title>UNESCO World Heritage</title>
  <!-- Brown ground (Pantone 4695C) -->
  <rect width="200" height="200" fill="#6B3A1F"/>
  <!-- Trilingual ring text -->
  <defs>
    <path id="ring-top" d="M 30,100 A 70,70 0 0 1 170,100"/>
    <path id="ring-bottom" d="M 30,100 A 70,70 0 0 0 170,100"/>
  </defs>
  <g fill="#C9A227" fontFamily="Helvetica, Arial, sans-serif" fontSize="11" fontWeight="700" letterSpacing="1">
    <text>
      <textPath href="#ring-top" startOffset="50%" textAnchor="middle">PATRIMÔNIO MUNDIAL</textPath>
    </text>
    <text>
      <textPath href="#ring-bottom" startOffset="25%" textAnchor="middle">WORLD HERITAGE</textPath>
      <textPath href="#ring-bottom" startOffset="75%" textAnchor="middle">PATRIMOINE MONDIAL</textPath>
    </text>
  </g>
  <!-- Olyff square in circle -->
  <g stroke="#C9A227" strokeWidth="3" fill="none" strokeLinejoin="miter">
    <!-- Inner square -->
    <rect x="78" y="78" width="44" height="44"/>
    <!-- Connecting lines square-to-circle (corners) -->
    <line x1="78" y1="78" x2="64" y2="64"/>
    <line x1="122" y1="78" x2="136" y2="64"/>
    <line x1="78" y1="122" x2="64" y2="136"/>
    <line x1="122" y1="122" x2="136" y2="136"/>
    <!-- Outer circle (interrupted by lines) -->
    <circle cx="100" cy="100" r="36"/>
  </g>
</svg>
