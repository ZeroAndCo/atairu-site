<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="UNESCO World Heritage / Patrimônio Mundial">
  <title>Patrimônio Mundial — UNESCO World Heritage Emblem</title>
  <defs>
    <!-- Top arc: Portuguese (left to right, reading along the top) -->
    <path id="ring-top" d="M 60 200 A 140 140 0 0 1 340 200" fill="none"/>
    <!-- Bottom arc: French + English (left to right along the bottom) -->
    <path id="ring-bottom" d="M 65 210 A 135 135 0 0 0 335 210" fill="none"/>
  </defs>

  <!-- Outer ring background -->
  <circle cx="200" cy="200" r="195" fill="#FFFFFF"/>
  <circle cx="200" cy="200" r="195" fill="none" stroke="#6B4F2C" stroke-width="3"/>
  <circle cx="200" cy="200" r="155" fill="none" stroke="#6B4F2C" stroke-width="2"/>

  <!-- Trilingual text ring, Pantone 4695C brown -->
  <g fill="#6B4F2C" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="600" letter-spacing="2">
    <text>
      <textPath href="#ring-top" startOffset="50%" text-anchor="middle">PATRIMÔNIO MUNDIAL</textPath>
    </text>
    <text>
      <textPath href="#ring-bottom" startOffset="50%" text-anchor="middle">PATRIMOINE MONDIAL • WORLD HERITAGE</textPath>
    </text>
  </g>

  <!-- Central emblem: square inscribed in circle (UNESCO geometric symbol) -->
  <g transform="translate(200 200)" fill="none" stroke="#6B4F2C" stroke-width="6" stroke-linejoin="miter">
    <!-- Circle -->
    <circle cx="0" cy="0" r="58"/>
    <!-- Square inscribed, rotated to align with circle/diamond shape of official mark -->
    <rect x="-58" y="-58" width="116" height="116"/>
    <!-- Inner diamond linking square corners (forms the petal/star) -->
    <path d="M -58 0 L 0 -58 L 58 0 L 0 58 Z"/>
  </g>
</svg>
